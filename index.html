<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#edf2ff">
  <title>កាលវិភាគសិក្សាផ្ទាល់ខ្លួន</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Kantumruy+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="page">
    <header class="page-header">
      <p class="eyebrow">MY STUDY PLANNER</p>
      <h1>កាលវិភាគសិក្សាផ្ទាល់ខ្លួន</h1>
      <p class="subtitle">រៀបចំពេលវេលាសិក្សារបស់អ្នកប្រចាំសប្តាហ៍</p>
    </header>

    <section class="schedule-card" aria-label="កាលវិភាគសិក្សា">
      <div class="schedule-top">
        <div>
          <h2>កាលវិភាគសិក្សា</h2>
          <p class="hint">ជ្រើសរើសមុខវិជ្ជានៅក្នុងប្រអប់នីមួយៗ</p>
        </div>
        <div class="time-label">ម៉ោង៖ 06:00 – 18:00</div>
      </div>

      <div class="table-wrap">
        <table id="scheduleTable">
          <thead><tr id="tableHead"></tr></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>

      <div class="actions">
        <span id="saveState" class="save-state" role="status">បានរក្សាទុកក្នុង Browser</span>
        <div class="buttons">
          <button id="clearBtn" class="button button-light" type="button">សម្អាតតារាង</button>
          <button id="pngBtn" class="button button-primary" type="button">ទាញយក PNG</button>
        </div>
      </div>
      <p class="footnote">ទិន្នន័យរក្សាទុកនៅក្នុង Browser របស់ឧបករណ៍នេះដោយស្វ័យប្រវត្តិ។</p>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="app.js"></script>
</body>
</html>
